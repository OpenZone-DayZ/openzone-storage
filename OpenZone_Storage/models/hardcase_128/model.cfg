//     case_a  smooth, 2.8 s: the latches undone one by one, the lid lifted with ease in and
//             out to rest on the hinge stop at 100 deg
//     case_b  snap,   1.5 s: the levers torn down almost at once and bouncing off the wall,
//             the lid flung open, it hits the stop at 110 deg, bounces back and settles
